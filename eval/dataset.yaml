# Ground truth for the evaluation harness (python -m eval.run).
#
# Every sample is either vulnerable (expected findings listed) or safe (expected: []).
# A prediction matches an expected finding when it is in the same file, within LINE_TOLERANCE lines and
# either has the same rule id or one of the listed CWEs. Unmatched predictions count as false positives.
# Paths are relative to the repository root.

samples:
  # --- OT / ICS rule pack (one vulnerable + one safe sample per rule) ---------------------------
  - {id: ot-001-vuln, category: ot, path: backend/tests/fixtures/ot/OT-001_vulnerable.py,
     expected: [{line: 7, rule: OT-001, cwe: [CWE-319]}]}
  - {id: ot-001-safe, category: ot, path: backend/tests/fixtures/ot/OT-001_safe.py, expected: []}
  - {id: ot-002-vuln, category: ot, path: backend/tests/fixtures/ot/OT-002_vulnerable.py,
     expected: [{line: 3, rule: OT-002, cwe: [CWE-20]}]}
  - {id: ot-002-safe, category: ot, path: backend/tests/fixtures/ot/OT-002_safe.py, expected: []}
  - {id: ot-003-vuln, category: ot, path: backend/tests/fixtures/ot/OT-003_vulnerable.py,
     expected: [{line: 5, rule: OT-003, cwe: [CWE-319]}]}
  - {id: ot-003-safe, category: ot, path: backend/tests/fixtures/ot/OT-003_safe.py, expected: []}
  - {id: ot-004-vuln, category: ot, path: backend/tests/fixtures/ot/OT-004_vulnerable.py,
     expected: [{line: 5, rule: OT-004, cwe: [CWE-319]}]}
  - {id: ot-004-safe, category: ot, path: backend/tests/fixtures/ot/OT-004_safe.py, expected: []}
  - {id: ot-005-vuln, category: ot, path: backend/tests/fixtures/ot/OT-005_vulnerable.py,
     expected: [{line: 4, rule: OT-005, cwe: [CWE-319, CWE-306]}, {line: 5, rule: OT-005, cwe: [CWE-319]}]}
  - {id: ot-005-safe, category: ot, path: backend/tests/fixtures/ot/OT-005_safe.py, expected: []}
  - {id: ot-006-vuln, category: ot, path: backend/tests/fixtures/ot/OT-006_vulnerable.py,
     expected: [{line: 5, rule: OT-006, cwe: [CWE-319]}]}
  - {id: ot-006-safe, category: ot, path: backend/tests/fixtures/ot/OT-006_safe.py, expected: []}
  - {id: ot-007-vuln, category: ot, path: backend/tests/fixtures/ot/OT-007_vulnerable.py,
     expected: [{line: 8, rule: OT-007, cwe: [CWE-1051, CWE-547]}]}
  - {id: ot-007-safe, category: ot, path: backend/tests/fixtures/ot/OT-007_safe.py, expected: []}
  - {id: ot-008-vuln, category: ot, path: backend/tests/fixtures/ot/OT-008_vulnerable.py,
     expected: [{line: 6, rule: OT-008, cwe: [CWE-1392, CWE-798, CWE-259]}]}
  - {id: ot-008-safe, category: ot, path: backend/tests/fixtures/ot/OT-008_safe.py, expected: []}
  - {id: ot-009-vuln, category: ot, path: backend/tests/fixtures/ot/OT-009_vulnerable.py,
     expected: [{line: 5, rule: OT-009, cwe: [CWE-295]}]}
  - {id: ot-009-safe, category: ot, path: backend/tests/fixtures/ot/OT-009_safe.py, expected: []}
  - {id: ot-010-vuln, category: ot, path: backend/tests/fixtures/ot/OT-010_vulnerable.py,
     expected: [{line: 5, rule: OT-010, cwe: [CWE-1088, CWE-400]}]}
  - {id: ot-010-safe, category: ot, path: backend/tests/fixtures/ot/OT-010_safe.py, expected: []}
  - id: ot-smart-grid
    category: ot
    path: backend/tests/fixtures/ot/smart_grid_gateway.py
    expected:
      - {line: 14, rule: OT-008, cwe: [CWE-1392, CWE-798]}
      - {line: 16, rule: OT-001, cwe: [CWE-319]}
      - {line: 16, rule: OT-007, cwe: [CWE-1051]}
      - {line: 16, rule: OT-010, cwe: [CWE-1088]}
      - {line: 22, rule: OT-002, cwe: [CWE-20]}
      - {line: 26, rule: OT-009, cwe: [CWE-295]}
      - {line: 30, rule: OT-006, cwe: [CWE-319]}
      - {line: 30, rule: OT-010, cwe: [CWE-1088]}
      - {line: 36, rule: OT-005, cwe: [CWE-319, CWE-306]}
      - {line: 37, rule: OT-005, cwe: [CWE-319]}

