name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests & offline evaluation
    runs-on: ubuntu-latest
    env:
      # No real OpenAI or OSV calls in CI.
      OPENAI_API_KEY: ""
      OSV_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - name: Offline evaluation (fails if OT rule recall or false-positive rate regress)
        working-directory: .
        run: |
          python -m eval.run --engine sast
          python -m eval.run --engine rules --check

  frontend:
    name: Frontend lint, tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
